[package]
name = "kyu"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
bytes = "1.12.2"
foldhash = "0.2.0"
futures = "0.3.34"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }

[[bench]]
name = "codec"
harness = false

[profile.profiling]
inherits = "release"
debug = true

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
